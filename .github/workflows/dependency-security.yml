name: Dependency security and application verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Repair dependency tree and lockfile
        run: npm audit fix

      - name: Install MCP test dependencies
        run: npm ci --prefix mcp

      - name: Verify dependency audit
        run: npm audit --audit-level=moderate

      - name: Run automated tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build production assets
        run: npm run build

      - name: Commit refreshed lockfile
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: repair and refresh audited dependencies"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "Dependency manifests are already current."
          fi
